[profile.default]
src = "contracts"
test = "test/foundry"
out = "out-foundry"
cache_path = "cache-foundry"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
offline = true
optimizer = true
optimizer_runs = 500
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./scripts/zkemail/fixtures" }]
skip = ["contracts/icm/ITeleporterMessenger.sol", "contracts/icm/ITeleporterReceiver.sol"]

[invariant]
runs = 64
depth = 64
fail_on_revert = false
